<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alogy AI Script Studio</title>
<style>
  :root{
    --bg:#131314;
    --bg-elev:#1e1f20;
    --bg-elev-2:#282a2c;
    --border:#3c4043;
    --text:#e3e3e3;
    --text-dim:#9aa0a6;
    --accent1:#4285f4;
    --accent2:#9b72cb;
    --accent3:#d96570;
    --user-bubble:#2b2d31;
    --radius:24px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Google Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    width:100%;
    max-width:900px;
    margin:0 auto;
    position:relative;
    background:var(--bg);
  }

  /* ===== HEADER ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 8px;
    flex-shrink:0;
    z-index:20;
    background:var(--bg);
  }
  .icon-btn{
    background:none;
    border:none;
    color:var(--text);
    font-size:20px;
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease;
  }
  .icon-btn:hover, .icon-btn:active{background:var(--bg-elev-2);}
  .model-title{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:19px;
    font-weight:500;
    color:var(--text);
    cursor:pointer;
    padding:6px 10px;
    border-radius:20px;
    user-select:none;
  }
  .model-title:hover{background:var(--bg-elev-2);}
  .model-title .caret{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .model-title .brand{
    background:linear-gradient(90deg,var(--accent1),var(--accent2) 50%,var(--accent3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:600;
  }

  /* ===== MAIN / WELCOME ===== */
  main{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 16px 8px;
    display:flex;
    flex-direction:column;
  }
  #welcomeScreen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    gap:18px;
  }
  .sparkle-icon{
    font-size:52px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2) 50%,var(--accent3));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(155,114,203,.35));
    animation:floaty 3s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  #welcomeScreen h1{
    font-size:26px;
    font-weight:500;
    line-height:1.4;
    max-width:480px;
    background:linear-gradient(90deg,#e3e3e3,#9aa0a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
  }
  #welcomeScreen .sub{
    color:var(--text-dim);
    font-size:14px;
    max-width:420px;
  }

  /* ===== CHAT STREAM ===== */
  #chatStream{
    display:none;
    flex-direction:column;
    gap:22px;
    padding-bottom:12px;
    width:100%;
  }
  .msg-row{
    display:flex;
    width:100%;
    animation:fadeUp .25s ease;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg-row.user{justify-content:flex-end;}
  .msg-row.ai{justify-content:flex-start;}

  .bubble{
    max-width:82%;
    padding:12px 16px;
    border-radius:20px;
    font-size:15.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.user{
    background:var(--user-bubble);
    border-bottom-right-radius:6px;
  }
  .bubble img.preview-img{
    max-width:220px;
    border-radius:14px;
    display:block;
    margin-top:8px;
  }
  .ai-wrap{
    max-width:92%;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .ai-avatar-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .ai-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    flex-shrink:0;
    background:conic-gradient(from 180deg,var(--accent1),var(--accent2),var(--accent3),var(--accent1));
    animation:spin 4s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .ai-text{
    font-size:15.5px;
    line-height:1.65;
    color:var(--text);
    padding-left:2px;
  }
  .cursor-blink{
    display:inline-block;
    width:2px;
    height:1em;
    background:var(--text-dim);
    margin-left:2px;
    vertical-align:text-bottom;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .action-row{
    display:flex;
    gap:4px;
    margin-top:2px;
    padding-left:2px;
  }
  .action-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:6px 10px;
    border-radius:16px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .action-btn:hover{background:var(--bg-elev-2); color:var(--text);}
  .action-btn.active{color:var(--accent1);}

  .thinking-dots{
    display:flex;
    gap:4px;
    padding:8px 2px;
  }
  .thinking-dots span{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-dim);
    animation:dotPulse 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2){animation-delay:.2s;}
  .thinking-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes dotPulse{
    0%,60%,100%{opacity:.3; transform:scale(.8);}
    30%{opacity:1; transform:scale(1);}
  }

  /* ===== INPUT AREA ===== */
  #inputArea{
    flex-shrink:0;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg);
  }
  #imgPreviewBar{
    display:none;
    padding:8px 6px;
    align-items:center;
    gap:10px;
  }
  #imgPreviewBar img{
    width:56px; height:56px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--border);
  }
  #imgPreviewBar .remove-img{
    background:var(--bg-elev-2);
    border:none;
    color:var(--text);
    width:26px;height:26px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
  }
  .input-shell{
    display:flex;
    align-items:flex-end;
    gap:6px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:6px 6px 6px 10px;
  }
  #promptInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:16px;
    font-family:inherit;
    resize:none;
    max-height:140px;
    padding:10px 4px;
    line-height:1.4;
  }
  #promptInput::placeholder{color:var(--text-dim);}
  .round-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
  }
  .round-btn.plain{
    background:transparent;
    color:var(--text-dim);
  }
  .round-btn.plain:hover{background:var(--bg-elev-2); color:var(--text);}
  .round-btn.mic.listening{
    background:var(--accent3);
    color:#fff;
    animation:pulseMic 1.2s ease-in-out infinite;
  }
  @keyframes pulseMic{
    0%,100%{box-shadow:0 0 0 0 rgba(217,101,112,.5);}
    50%{box-shadow:0 0 0 8px rgba(217,101,112,0);}
  }
  .round-btn.send{
    background:var(--text-dim);
    color:var(--bg);
  }
  .round-btn.send.ready{
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#fff;
  }
  .round-btn.send:active{transform:scale(.92);}
  #hiddenFileInput{display:none;}

  #toast{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#3c4043;
    color:#fff;
    padding:10px 18px;
    border-radius:24px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:999;
    white-space:nowrap;
    box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  main::-webkit-scrollbar{width:6px;}
  main::-webkit-scrollbar-thumb{background:var(--bg-elev-2); border-radius:10px;}

  @media (max-width:480px){
    #welcomeScreen h1{font-size:21px;}
    .sparkle-icon{font-size:44px;}
    .bubble{max-width:88%;}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="model-title" id="modelTitle">
      <span><span class="brand">Alogy AI</span> Script Pro</span>
      <span class="caret">▼</span>
    </div>
    <button class="icon-btn" id="newChatBtn" aria-label="New chat">➕</button>
  </header>

  <main id="mainScroll">
    <div id="welcomeScreen">
      <div class="sparkle-icon">✨</div>
      <h1>What's on your creator mind?</h1>
      <div class="sub">Type, speak or upload images for your script concept.</div>
    </div>

    <div id="chatStream"></div>
  </main>

  <div id="inputArea">
    <div id="imgPreviewBar">
      <img id="imgPreviewThumb" src="" alt="preview">
      <span style="font-size:13px;color:var(--text-dim);flex:1;">Image attached</span>
      <button class="remove-img" id="removeImgBtn">✕</button>
    </div>

    <div class="input-shell">
      <button class="round-btn plain" id="plusBtn" aria-label="Attach image">➕</button>
      <textarea id="promptInput" rows="1" placeholder="Enter a prompt here..."></textarea>
      <button class="round-btn plain mic" id="micBtn" aria-label="Voice input">🎤</button>
      <button class="round-btn send" id="sendBtn" aria-label="Send">↑</button>
    </div>
    <input type="file" id="hiddenFileInput" accept="image/*">
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // ============ ELEMENT REFS ============
  const welcomeScreen = document.getElementById('welcomeScreen');
  const chatStream = document.getElementById('chatStream');
  const mainScroll = document.getElementById('mainScroll');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const plusBtn = document.getElementById('plusBtn');
  const micBtn = document.getElementById('micBtn');
  const hiddenFileInput = document.getElementById('hiddenFileInput');
  const imgPreviewBar = document.getElementById('imgPreviewBar');
  const imgPreviewThumb = document.getElementById('imgPreviewThumb');
  const removeImgBtn = document.getElementById('removeImgBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const menuBtn = document.getElementById('menuBtn');
  const toast = document.getElementById('toast');

  let pendingImage = null; // { dataUrl }
  let isListening = false;
  let recognition = null;

  // ============ TOAST ============
  let toastTimer = null;
  function showToast(msg, duration){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), duration || 2200);
  }

  // ============ AUTO-RESIZE TEXTAREA ============
  function autoResize(){
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + 'px';
    updateSendState();
  }
  promptInput.addEventListener('input', autoResize);

  function updateSendState(){
    const hasContent = promptInput.value.trim().length > 0 || pendingImage;
    sendBtn.classList.toggle('ready', !!hasContent);
  }

  // ============ SCROLL HELPER ============
  function scrollToBottom(){
    requestAnimationFrame(()=>{
      mainScroll.scrollTop = mainScroll.scrollHeight;
    });
  }

  // ============ NEW CHAT ============
  function resetChat(){
    chatStream.innerHTML = '';
    chatStream.style.display = 'none';
    welcomeScreen.style.display = 'flex';
    clearImage();
    promptInput.value = '';
    autoResize();
  }
  newChatBtn.addEventListener('click', resetChat);
  menuBtn.addEventListener('click', ()=> showToast('Menu coming soon'));
  document.getElementById('modelTitle').addEventListener('click', ()=> showToast('Alogy AI Script Pro — current model'));

  // ============ IMAGE UPLOAD (PLUS BUTTON) ============
  plusBtn.addEventListener('click', ()=> hiddenFileInput.click());

  hiddenFileInput.addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      showToast('Please select an image file');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(ev){
      pendingImage = { dataUrl: ev.target.result };
      imgPreviewThumb.src = pendingImage.dataUrl;
      imgPreviewBar.style.display = 'flex';
      updateSendState();
    };
    reader.onerror = function(){
      showToast('Could not read image');
    };
    reader.readAsDataURL(file);
    hiddenFileInput.value = '';
  });

  function clearImage(){
    pendingImage = null;
    imgPreviewBar.style.display = 'none';
    imgPreviewThumb.src = '';
    updateSendState();
  }
  removeImgBtn.addEventListener('click', clearImage);

  // ============ SPEECH RECOGNITION (MIC) ============
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initRecognition(){
    if(!SpeechRecognitionAPI) return null;
    const rec = new SpeechRecognitionAPI();
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    // Default to Hindi (India) which generally also captures Hinglish reasonably;
    // users can also type Marathi/English directly.
    rec.lang = 'hi-IN';

    rec.onstart = function(){
      isListening = true;
      micBtn.classList.add('listening');
    };
    rec.onresult = function(event){
      let interim = '';
      let final = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const transcript = event.results[i][0].transcript;
        if(event.results[i].isFinal){
          final += transcript;
        } else {
          interim += transcript;
        }
      }
      if(final){
        promptInput.value = (promptInput.value ? promptInput.value + ' ' : '') + final.trim();
        autoResize();
      }
    };
    rec.onerror = function(event){
      isListening = false;
      micBtn.classList.remove('listening');
      if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        showToast('Microphone permission blocked. Enable it in browser settings.', 3200);
      } else if(event.error === 'no-speech'){
        showToast('No speech detected. Try again.');
      } else {
        showToast('Voice input unavailable right now.');
      }
    };
    rec.onend = function(){
      isListening = false;
      micBtn.classList.remove('listening');
    };
    return rec;
  }

  micBtn.addEventListener('click', function(){
    if(!SpeechRecognitionAPI){
      showToast('Voice input is not supported on this browser.', 3000);
      return;
    }
    if(isListening){
      recognition && recognition.stop();
      return;
    }
    try{
      recognition = initRecognition();
      if(recognition) recognition.start();
    }catch(err){
      showToast('Could not start microphone. Check permissions.', 3000);
    }
  });

  // ============ LANGUAGE DETECTION ============
  function detectLanguage(text){
    const devanagari = /[\u0900-\u097F]/;
    if(devanagari.test(text)){
      // crude Marathi vs Hindi heuristic using distinctive Marathi words
      const marathiHints = ['आहे','मला','तुम्ही','काय','होतं','आहात','मराठी','करतोय','सांग'];
      const lower = text;
      for(const w of marathiHints){
        if(lower.indexOf(w) !== -1) return 'mr';
      }
      return 'hi';
    }
    // romanized Hindi/Marathi detection (Hinglish)
    const hinglishHints = ['kaise','kaisi','kya','hai','aap','tum','nahi','kar','acha','theek','namaste','kripya'];
    const marathiRoman = ['kasa','kashi','tumhi','ahe','mala','kay','zala','sang'];
    const lowerText = text.toLowerCase();
    if(marathiRoman.some(w => lowerText.includes(w))) return 'mr-roman';
    if(hinglishHints.some(w => lowerText.includes(w))) return 'hi-roman';
    return 'en';
  }

  // ============ GREETING DETECTION ============
  function isGreeting(text){
    const t = text.trim().toLowerCase();
    const greetingPatterns = [
      'hello','hi','hey','yo','sup','good morning','good evening','good afternoon',
      'namaste','namaskar','kaise ho','kasa ahe','kaisi ho','kese ho','how are you',
      'kya haal','kya hal','kem cho','vanakkam','hola'
    ];
    if(t.length > 40) return false;
    return greetingPatterns.some(p => t === p || t.startsWith(p));
  }

  function isThanksOrBye(text){
    const t = text.trim().toLowerCase();
    const patterns = ['thank','thanks','shukriya','dhanyawad','bye','alvida','byee','ty'];
    return t.length < 30 && patterns.some(p => t.includes(p));
  }

  // ============ MOCK AI RESPONSE GENERATOR ============
  function generateGreetingReply(text, lang){
    const repliesEn = [
      "Hey there! 👋 I'm doing great and ready to help you craft something cinematic. What story idea is on your mind today?",
      "Hello! Good to see you. Got a concept you want turned into a script, or just want to chat for a bit?",
      "Hi! I'm all set. Share a story spark, a mood, or even an image, and I'll help shape it into a scene."
    ];
    const repliesHi = [
      "Namaste! Main bilkul theek hoon, aapka din kaisa chal raha hai? Batayein, kya kahani banani hai aaj?",
      "Hey! Sab badhiya hai mere taraf se 😊 Bataiye, koi script idea hai jise hum saath mein banayein?",
      "Kaise ho aap? Main ready hoon aapke liye ek zabardast cinematic script likhne ke liye, bas concept share kar dijiye."
    ];
    const repliesMr = [
      "Namaskar! Mi ekdum thik ahe, tumcha divas kasa jat ahe? Sanga, aaj kontya story cha script banवायचा?",
      "Kasa ahet tumhi? Mala ekdum chan vatatay, chala eka sahi script cha kalpanela suruvat karuya!",
      "Namaste! Sagla mast ahe majhya baju ne. Konti concept dokyat ahe, tichi script banवूया?"
    ];
    let pool = repliesEn;
    if(lang === 'hi' || lang === 'hi-roman') pool = repliesHi;
    if(lang === 'mr' || lang === 'mr-roman') pool = repliesMr;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function generateThanksReply(lang){
    if(lang === 'hi' || lang === 'hi-roman') return "Koi baat nahi! Jab bhi naya idea aaye, yahin aa jaana. Happy writing! 🎬";
    if(lang === 'mr' || lang === 'mr-roman') return "Kahi harkat nahi! Navi kalpana ali ki punha ya. Shubh lekhan! 🎬";
    return "You're welcome! Come back anytime you've got a new idea. Happy scripting! 🎬";
  }

  function extractTitle(text){
    const clean = text.replace(/[.?!]+$/,'').trim();
    const words = clean.split(/\s+/).slice(0, 6).join(' ');
    return words.charAt(0).toUpperCase() + words.slice(1);
  }

  function generateScript(text, lang, hasImage){
    const title = extractTitle(text) || (hasImage ? 'Visual Concept' : 'Untitled Concept');

    if(lang === 'mr' || lang === 'mr-roman'){
      return (
`[CORE CONCEPT]
"${title}" hi eka ${hasImage ? 'chitratun sucharlelya' : 'kalpanevar aadharit'} katha aahe, jyat bhavनांचं khol darshan ghadत. Mool sur ahे utsukta, sanघर्ष ani atmavishwas.

[SCENE 1: OLAKH (INTRODUCTION)]
INT./EXT. MUKHYA JAGA – DIVASACHI VEL
Mukhya patra apalya sadharan jagat disat, pan tyanchya dolyat kahitari adhurach jaणva. Camera halu halu tyanchya cheharyavar zoom karto, prekshakانna tyanchya bhavनांशी jodun ghet.
(Vatavaran: shant, pan tanavपूर्ण)

[SCENE 2: वळण (THE TWIST)]
Achanak eka ghatanene sarva kahi badalून jaते. Mukhya patrala ek asa satya kalते jyamule tyanchi aataparyantachi samaj dhaसळते. Sangeet tivra hote, camera angle vegळe hotात prekshakans tya dhakkyachi janiv karun देण्यासाठी.

[SCENE 3: kळस (CLIMAX)]
Mukhya patra shevatchya nirnayacha samor jate — parat फिरायचं ka pudhe जायचं. Bhavनांचा उद्रेक hoto, ani eka shaktishali drishyaने katha sampते je prekshakanna vichar karायला lावते.

(Suggested tone: cinematic, emotionally driven, natural Marathi dialogue)`
      );
    }

    if(lang === 'hi' || lang === 'hi-roman'){
      return (
`[CORE CONCEPT]
"${title}" ek ${hasImage ? 'diye gaye image se prerit' : 'aapke idea par aadharit'} kahani hai, jisme emotion aur drama ka gehra sangam hai. Iska core theme hai — sangharsh se aatmvishwas tak ka safar.

[SCENE 1: PARICHAY (INTRODUCTION)]
INT./EXT. MUKHYA STHAAN – DIN KA SAMAY
Mukhya kirdaar apni roz ki zindagi mein dikhte hain, lekin unki aankhon mein ek adhoora sawal chhupa hai. Camera dheere-dheere unke chehre par zoom hota hai, taaki darshak unse judaav mehsoos karein.

[SCENE 2: MOD (THE TWIST)]

  // ============ RENDER: USER MESSAGE ============
  function renderUserMessage(text, imageDataUrl){
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble user';

    if(text) bubble.appendChild(document.createTextNode(text));
    if(imageDataUrl){
      const img = document.createElement('img');
      img.src = imageDataUrl;
      img.className = 'preview-img';
      bubble.appendChild(img);
    }
    row.appendChild(bubble);
    chatStream.appendChild(row);
    scrollToBottom();
  }

  // ============ RENDER: AI THINKING ============
  function renderThinking(){
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.innerHTML =
      '<div class="ai-wrap">' +
        '<div class="ai-avatar-row"><div class="ai-avatar"></div>' +
          '<div class="thinking-dots"><span></span><span></span><span></span></div>' +
        '</div>' +
      '</div>';
    chatStream.appendChild(row);
    scrollToBottom();
    return row;
  }

  // ============ RENDER: AI MESSAGE (with typewriter) ============
  function renderAiMessage(thinkingRow, fullText){
    thinkingRow.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'ai-wrap';

    const avatarRow = document.createElement('div');
    avatarRow.className = 'ai-avatar-row';
    const avatar = document.createElement('div');
    avatar.className = 'ai-avatar';
    avatarRow.appendChild(avatar);
    wrap.appendChild(avatarRow);

    const textEl = document.createElement('div');
    textEl.className = 'ai-text';
    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    wrap.appendChild(textEl);
    thinkingRow.appendChild(wrap);

    let i = 0;
    textEl.appendChild(cursor);
    const speed = 12; // ms per character, smooth typewriter

    function typeStep(){
      if(i < fullText.length){
        const chunk = fullText.charAt(i);
        cursor.insertAdjacentText('beforebegin', chunk);
        i++;
        scrollToBottom();
        setTimeout(typeStep, speed);
      } else {
        cursor.remove();
        renderActionRow(wrap, fullText);
        scrollToBottom();
      }
    }
    typeStep();
  }

  // ============ RENDER: ACTION ROW (Listen / Copy) ============
  function renderActionRow(wrap, fullText){
    const actionRow = document.createElement('div');
    actionRow.className = 'action-row';

    const listenBtn = document.createElement('button');
    listenBtn.className = 'action-btn';
    listenBtn.innerHTML = '🔊 <span>Listen</span>';
    listenBtn.addEventListener('click', function(){
      handleListen(fullText, listenBtn);
    });

    const copyBtn = document.createElement('button');
    copyBtn.className = 'action-btn';
    copyBtn.innerHTML = '📋 <span>Copy</span>';
    copyBtn.addEventListener('click', function(){
      handleCopy(fullText);
    });

    actionRow.appendChild(listenBtn);
    actionRow.appendChild(copyBtn);
    wrap.appendChild(actionRow);
  }

  // ============ LISTEN (TEXT-TO-SPEECH) ============
  let currentUtterance = null;
  function pickVoiceForText(text){
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    const devanagari = /[\u0900-\u097F]/.test(text);
    let lang = 'en-US';
    if(devanagari) lang = 'hi-IN';
    let voice = voices.find(v => v.lang === lang);
    if(!voice) voice = voices.find(v => v.lang && v.lang.startsWith(lang.split('-')[0]));
    return { voice, lang };
  }

  function handleListen(text, btn){
    if(!window.speechSynthesis){
      showToast('Speech playback not supported on this browser.', 3000);
      return;
    }
    if(window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      btn.classList.remove('active');
      if(currentUtterance === btn) currentUtterance = null;
      return;
    }
    const cleanText = text.replace(/\[.*?\]/g, '. ');
    const utter = new SpeechSynthesisUtterance(cleanText);
    const picked = pickVoiceForText(text);
    utter.lang = picked.lang;
    if(picked.voice) utter.voice = picked.voice;
    utter.rate = 0.98;
    utter.pitch = 1;

    btn.classList.add('active');
    utter.onend = function(){ btn.classList.remove('active'); };
    utter.onerror = function(){
      btn.classList.remove('active');
      showToast('Could not play audio.');
    };
    window.speechSynthesis.speak(utter);
  }

  // ensure voices are loaded (some browsers load async)
  if(window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = function(){};
  }

  // ============ COPY ============
  function handleCopy(text){
    const cleanText = text;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(cleanText).then(function(){
        showToast('Copied to clipboard ✅');
      }).catch(function(){
        fallbackCopy(cleanText);
      });
    } else {
      fallbackCopy(cleanText);
    }
  }

  function fallbackCopy(text){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied to clipboard ✅');
    }catch(e){
      showToast('Copy failed. Please copy manually.');
    }
  }

  // ============ MAIN SEND HANDLER ============
  function handleSend(){
    const text = promptInput.value.trim();
    const imageAttached = pendingImage;

    if(!text && !imageAttached) return;

    if(welcomeScreen.style.display !== 'none'){
      welcomeScreen.style.display = 'none';
      chatStream.style.display = 'flex';
    }

    renderUserMessage(text, imageAttached ? imageAttached.dataUrl : null);

    // reset input
    promptInput.value = '';
    autoResize();
    const hadImage = !!imageAttached;
    clearImage();

    const thinkingRow = renderThinking();

    // simulate a short thinking delay before typewriter response
    setTimeout(function(){
      const lang = detectLanguage(text || '');
      let responseText;

      if(!text && hadImage){
        responseText = generateScript('a visual scene', lang === 'en' ? 'en' : lang, true);
      } else if(isGreeting(text)){
        responseText = generateGreetingReply(text, lang);
      } else if(isThanksOrBye(text)){
        responseText = generateThanksReply(lang);
      } else {
        responseText = generateScript(text, lang, hadImage);
      }

      renderAiMessage(thinkingRow, responseText);
    }, 700 + Math.random() * 400);
  }

  sendBtn.addEventListener('click', handleSend);
  promptInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });

  // init state
  updateSendState();
  autoResize();

})();
</script>
